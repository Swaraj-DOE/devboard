#Goal to deploy the built image From ci steps once the ci workflow is succeeded

name: CD

on:
   workflow_run:
    workflows: ['Code Quality']
    types: [completed]
    branches:
      - 'advanced'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v7
    
      - name: Copy Example Env to main Env
        run: cp .env.example .env

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
         username: ${{ vars.DOCKERHUB_USERNAME }} # Can also be stored in secrets
         password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d

      
